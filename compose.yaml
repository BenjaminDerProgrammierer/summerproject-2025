services:
  database:
    image: docker.io/library/postgres:18-alpine
    environment:
      POSTGRES_DB: webontour
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./export:/export:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d webontour"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
